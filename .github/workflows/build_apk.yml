name: Build Gaming DNS APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Recreate Clean Android Project
        run: |
          # ۱. گرفتن بکاپ از کدهای ارزشمند VPN و ظاهر برنامه شما
          mkdir -p /tmp/my_backup/res/drawable /tmp/my_backup/res/values
          cp android/app/src/main/AndroidManifest.xml /tmp/my_backup/
          cp android/app/src/main/kotlin/com/example/gaming_dns/MainActivity.kt /tmp/my_backup/
          cp android/app/src/main/kotlin/com/example/gaming_dns/GamingVpnService.kt /tmp/my_backup/
          cp android/app/src/main/res/drawable/ic_launcher.xml /tmp/my_backup/res/drawable/ || true
          cp android/app/src/main/res/values/styles.xml /tmp/my_backup/res/values/ || true
          cp android/app/src/main/res/values/colors.xml /tmp/my_backup/res/values/ || true

          # ۲. پاک کردن پوشه قدیمی و دارای ارور
          rm -rf android

          # ۳. ساخت پوشه اندروید کاملاً جدید و هماهنگ با سرورهای امروزی
          flutter create --platforms=android --org com.example --project-name gaming_dns .

          # ۴. بازگرداندن کدهای شما به پوشه جدید
          cp /tmp/my_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp /tmp/my_backup/MainActivity.kt android/app/src/main/kotlin/com/example/gaming_dns/MainActivity.kt
          cp /tmp/my_backup/GamingVpnService.kt android/app/src/main/kotlin/com/example/gaming_dns/GamingVpnService.kt
          
          mkdir -p android/app/src/main/res/drawable android/app/src/main/res/values
          cp /tmp/my_backup/res/drawable/ic_launcher.xml android/app/src/main/res/drawable/ic_launcher.xml || true
          cp /tmp/my_backup/res/values/styles.xml android/app/src/main/res/values/styles.xml || true
          cp /tmp/my_backup/res/values/colors.xml android/app/src/main/res/values/colors.xml || true

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gaming-DNS-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
