name: Build Gaming DNS APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Fix Gradle & Properties for Flutter 3.27+
        run: |
          cd android
          
          # ۱. ارتقای اجباری گریدل به نسخه ۸.۱۴ (رفع ارور قبلی)
          mkdir -p gradle/wrapper
          echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
          echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.14-all.zip" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          
          # ۲. اصلاح تنظیمات قدیمی کاتلین و DSL در فایل gradle.properties
          sed -i 's/android.newDsl=false/android.newDsl=true/g' gradle.properties
          sed -i 's/android.builtInKotlin=false/android.builtInKotlin=true/g' gradle.properties

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gaming-DNS-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
